name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COMMIT_SHA: ${{ github.sha }}

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-2025
          - os: linux
            runner: ubuntu-24.04
            configs: develop_glfw_x86_64
          - os: macos
            runner: macos-15
            configs: develop_glfw_arm64 develop_glfw_x86_64

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Premake
        uses: abel0b/setup-premake@v2.4
        with:
          version: "5.0.0-beta8"

      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libxext-dev libgl1-mesa-dev

      - name: Set up ccache
        if: matrix.os != 'windows'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}
          max-size: 500M

      - name: Set up MSBuild
        if: matrix.os == 'windows'
        uses: microsoft/setup-msbuild@v2

      - name: Build
        if: matrix.os == 'windows'
        run: |
          premake5 vs2022
          msbuild /m /p:Configuration=Develop /p:Platform=GLFW_x86_64 .

      - name: Build
        if: matrix.os != 'windows'
        run: |
          chmod +x .premake/premake5
          premake5 gmake
          for config in ${{ matrix.configs }}; do
            make -j"$(getconf _NPROCESSORS_ONLN)" config=$config CC="ccache clang" CXX="ccache clang++"
          done

      - name: Package
        if: matrix.os == 'windows'
        run: |
          New-Item -ItemType Directory package | Out-Null
          Copy-Item -Recurse workdir/* package/
          Copy-Item THIRD_PARTY_LICENSES.txt, TuneBloom/bin/TuneBloom-GLFW_x86_64-Develop/out/TuneBloom.exe package/
          Compress-Archive -Path package/* -DestinationPath TuneBloom-windows.zip

      - name: Package
        if: matrix.os == 'linux'
        run: |
          mkdir package
          cp -r workdir/. package/
          cp THIRD_PARTY_LICENSES.txt TuneBloom/bin/TuneBloom-GLFW_x86_64-Develop/out/TuneBloom package/
          tar -czf TuneBloom-linux.tar.gz -C package .

      - name: Package
        if: matrix.os == 'macos'
        env:
          BUNDLE_VERSION: ${{ github.run_number }}
        run: |
          TuneBloom/src/platform/macos/make_bundle.sh package \
            TuneBloom/bin/TuneBloom-GLFW_ARM64-Develop/out/TuneBloom \
            TuneBloom/bin/TuneBloom-GLFW_x86_64-Develop/out/TuneBloom
          ditto -c -k --sequesterRsrc --keepParent package/TuneBloom.app TuneBloom-macos.zip

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: TuneBloom-${{ matrix.os }}
          path: TuneBloom-${{ matrix.os }}.*

  release:
    needs: build
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Get date
        id: date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Publish nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-${{ steps.date.outputs.date }}
          name: Nightly Beta — ${{ steps.date.outputs.date }}
          body: Automated nightly build from commit ${{ github.sha }}
          prerelease: true
          files: dist/*
